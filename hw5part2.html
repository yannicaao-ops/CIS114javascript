<h3>State Information Lookup</h3>
<form id="stateForm">
  <label for="stateInput">Enter a State Name or Abbreviation:</label><br>
  <input type="text" id="stateInput" name="stateInput"><br><br>

  <button type="button" onclick="getStateInfo()">State Info</button>
  <button type="reset" onclick="clearOutput()">Clear</button><br><br>

  <textarea id="output" rows="8" cols="50" readonly></textarea>
</form>

<script>
const states = [
  ["AL", "Alabama", "Montgomery", "5,157,699"],
  ["AK", "Alaska", "Juneau", "740,133"],
  ["AZ", "Arizona", "Phoenix", "7,582,384"],
  ["AR", "Arkansas", "Little Rock", "3,088,354"],
  ["CA", "California", "Sacramento", "39,431,263"],
  ["CO", "Colorado", "Denver", "5,957,493"]
];

function getStateInfo() {
  const userInput = document.getElementById("stateInput").value.trim().toLowerCase();
  const output = document.getElementById("output");
  output.value = ""; // clear previous output

  if (userInput === "") {
    output.value = "Please enter a state name or abbreviation.";
    return;
  }

  let found = false;
  for (let i = 0; i < states.length; i++) {
    let abbr = states[i][0].toLowerCase();
    let name = states[i][1].toLowerCase();

    if (userInput === abbr || userInput === name) {
      found = true;
      output.value = 
        "Thanks for your inquiry, here is the information you requested:\n" +
        "State abbr = " + states[i][0] + "\n" +
        "State Name = " + states[i][1] + "\n" +
        "Capital = " + states[i][2] + "\n" +
        "Population = " + states[i][3];
      break;
    }
  }

  if (!found) {
    output.value = "Sorry, we do not have information about this state.\n" +
                   "We only have information about: Alabama, Alaska, Arizona, Arkansas, California, and Colorado.";
  }
}

function clearOutput() {
  document.getElementById("output").value = "";
}
</script>
