<h3>Student Grades</h3>
<form id="gradeForm">
  <label for="hwavg">Homework Average:</label>
  <input type="number" id="hwavg" name="hwavg" min="0" max="100"><br>

  <label for="midExam">Mid-Term Exam Score:</label>
  <input type="number" id="midExam" name="midExam" min="0" max="100"><br>

  <label for="finalExam">Final Exam Score:</label>
  <input type="number" id="finalExam" name="finalExam" min="0" max="100"><br>

  <label for="participation">Participation:</label>
  <input type="number" id="participation" name="participation" min="0" max="100"><br><br>

  <input type="button" value="Calculate Grade" onclick="calculateGrade()">
  <input type="reset" value="Reset" onclick="document.getElementById('result').value = ''">
</form>
<textarea id="result" readonly></textarea>

<script>
  function calculateGrade() {
    var hwavg, midExam, finalExam, participation;

  // Get values from the input field//
 hwavg = document.getElementById("hwavg").value;
 midExam = document.getElementById("midExam").value;
 finalExam = document.getElementById("finalExam").value;
 participation = document.getElementById("participation").value;

  // Check for valid input
  if (hwavg === "" || midExam === "" || finalExam === "" || participation === "" ||
      hwavg < 0 || hwavg > 100 || midExam < 0 || midExam > 100 ||
      finalExam < 0 || finalExam > 100 || participation < 0 || participation > 100) {
    document.getElementById("result").value = "Error: Please enter valid numbers between 0 and 100 in all fields.";
    return;
  }
 
 
  //convert the string to number//
  hwavg = parseFloat(hwavg);
  midExam = parseFloat(midExam);
  finalExam = parseFloat(finalExam);
  participation = parseFloat(participation);

  // Calculate final average
  let finalAverage = Math.round((0.5 * hwavg) + (0.2 * midExam) + (0.2 * finalExam) + (0.1 * participation));

  // Determine letter grade
  let letterGrade;
  if (finalAverage >= 90) letterGrade = "A";
  else if (finalAverage >= 80) letterGrade = "B";
  else if (finalAverage >= 70) letterGrade = "C";
  else if (finalAverage >= 60) letterGrade = "D";
  else letterGrade = "F";

  // Prepare result
  let message = "Final Average: " + finalAverage + "%\n";
  message += "Letter Grade: " + letterGrade + "\n";

  if (letterGrade === "D" || letterGrade === "F") {
    message += "Student must retake the course.";
  }

  // Display results
  document.getElementById("result").value = message;
}

</script>
