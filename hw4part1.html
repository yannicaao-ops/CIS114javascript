<h3>Part 1: Using a For Loop</h3>
<p id="forResult"></p>

<h3>Part 2: Using a While Loop</h3>
<p id="whileResult"></p>

<script>
  // Part 1: Using a For Loop
  let sumFor = 0;
  let productFor = 1;
  let forNumbers = [];
  for (let i = 5; i <= 25; i += 4) {
    sumFor += i;
    productFor *= i;
    forNumbers.push(i);
  }
 document.getElementById("forResult").innerHTML = 
  "The result of " + forNumbers.join(" * ") + " is " + productFor.toLocaleString() + "<br>" +
  "The result of " + forNumbers.join(" + ") + " is " + sumFor.toLocaleString();

  // Part 2: Using a While Loop
  let sumWhile = 0;
  let productWhile = 1;
  let whileNumbers = [];
  let j = 3;

  while (j <= 18) {
    sumWhile += j;
    productWhile *= j;
    whileNumbers.push(j);
    j += 3;
  }
  document.getElementById("whileResult").innerHTML = 
    "The result of " + whileNumbers.join(" * ") + " is " + productWhile.toLocaleString() + "<br>" +
    "The result of " + whileNumbers.join(" + ") + " is " + sumWhile.toLocaleString();
  </script>
